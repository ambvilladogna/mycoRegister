# /etc/nginx/snippets/mycoregister-security-headers.conf
# Included at server level and again in every location that has its own
# add_header (currently /sw.js). `always` = also on 4xx/5xx responses.

add_header Strict-Transport-Security "max-age=63072000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ENFORCED (not report-only): drop camera=(self) to camera=() if the app never uses it
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

# REPORT-ONLY: nothing is blocked, violations only show in the browser console.
# add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tile.thunderforest.com; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
# ENFORCED: block everything except self, data: and blob: (for images). Add frame-ancestors 'self' to block embedding in other sites.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tile.thunderforest.com; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;