server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name _;
    ssl_reject_handshake on;   # nginx >= 1.19.4; no certificate needed

    return 444;
}
