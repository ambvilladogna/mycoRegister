# =============================================================================
#
# DEVELOPMENT
#
# PWA (static files) + Node API (/api/) + CouchDB (/db/), behind Cloudflare
#
# Lives OUTSIDE this file (must exist before reload):
#   /etc/nginx/conf.d/00-baseline-security.conf
#         limit_req_zone $binary_remote_addr zone=api:10m rate=...;
#   /etc/nginx/conf.d/10-custom-log-formats.conf
#         log_format combined_plus ...;
#   /etc/nginx/conf.d/20-cloudflare-realip.conf
#         set_real_ip_from <Cloudflare ranges>; 
#         real_ip_header CF-Connecting-IP;
#   /etc/nginx/snippets/mycoregister-security-headers.conf
#   sites-enabled/default  (default_server + ssl_reject_handshake)
#
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name ${NGINX_SERVER_NAME};

    # 301 to the fixed server_name (not $host: no Host-header reflection)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${NGINX_SERVER_NAME};

    server_tokens off;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     ${NGINX_TLS_CERT};
    ssl_certificate_key ${NGINX_TLS_KEY};

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ECC origin cert => only ECDSA suites can actually be negotiated
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # --- Security headers --------------------------------------------------
    # IMPORTANT: add_header in a location discards ALL inherited add_header
    # directives. Any location that needs its own add_header must re-include
    # this snippet (currently only /sw.js).
    include /etc/nginx/snippets/mycoregister-security-headers.conf;

    # --- Content & logs ----------------------------------------------------
    root ${NGINX_WEB_ROOT};

    access_log ${NGINX_ACCESS_LOG} combined_plus;
    error_log  ${NGINX_ERROR_LOG} warn;

    # --- Deny rules --------------------------------------------------------
    # Regex locations are checked in file order and win over plain prefix
    # locations, hence ^~ on /api/ and /db/ below.
    # Denied requests are intentionally LOGGED (abuse detection).

    # Hidden files (also blocks /.well-known/ - allow it explicitly if ever needed)
    location ~ /\. {
        deny all;
        log_not_found off;
    }

    # Sensitive extensions (anchored: does not match .logo.png, .github, ...)
    location ~ \.(htaccess|htpasswd|ini|log|sh|inc|bak|git)$ {
        deny all;
        log_not_found off;
    }

    # --- Service worker: never cached, keeps security headers ---------------
    location = /sw.js {
        include /etc/nginx/snippets/mycoregister-security-headers.conf;

        # Strongest caching prevention
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # Prevent 304 responses by disabling revalidation headers
        etag off;
        if_modified_since off;
        access_log off;
        log_not_found off;
    }

    # Cache control for static assets disabled because of:
    # + Aggressive TTL (7 days) prevented any updates
    # + Broad regex caught API endpoints and dynamic content
    # + Browser cache priority overrode your SW's intelligent caching
    # + No server logs masked the real issue
    # location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf|svg|eot)$ {
    #     expires 7d;
    #     add_header Cache-Control "public, max-age=604800";
    #     access_log off;
    #     log_not_found off;
    # }

    # Just logging optimization, no caching
    location ~* ^/(static|assets)/.*\.(js|css|jpg|png|gif|ico|woff2|svg)$ {
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API login (rate limited) -------------------------------------------
    # Zone "api" is defined in http{} by 00-baseline-security.conf.
    # Needs the real client IP (conf.d/cloudflare-realip.conf), 
    # otherwise every client shares Cloudflare's edge addresses.
    location ^~ /api/login {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass ${NGINX_API_UPSTREAM};

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API (Node) ----------------------------------------------------------
    location ^~ /api/ {
        proxy_pass ${NGINX_API_UPSTREAM};

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # [masking]: replaces the body of these errors, status is kept (see header)
        # This is disabled for development because it hides the real error message from the Node API.
        # proxy_intercept_errors on;
        # error_page 400 401 403 404 405 500 502 503 504 /api_error.json;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NB: no access_log off here - it would also silence the log entry of the
    # ORIGINAL request that was redirected to this location.
    location = /api_error.json {
        internal;
        default_type application/json;
        return 200 '{"error": true, "message": "Request failed", "code": $status}';
    }

    # --- CouchDB (JWT auth is done by CouchDB itself) ------------------------
    location ^~ /db/ {
        default_type application/json;

        # 1) Bearer tokens only: admin Basic credentials can never be tried
        #    from outside (administer CouchDB through an SSH tunnel to :5984)
        if ($http_authorization !~* "^Bearer ") { 
            return 401 '{"error":"unauthorized","reason":"Bearer token required"}'; 
        }

        # 2) Only the app DB. No _session, _utils, _all_dbs, _node, _users...
        #    >>> replace YOUR_DB_NAME (lowercase, as in the PouchDB URL) <<<
        if ($uri !~ "^/db/${NGINX_COUCHDB_DB_NAME}(/|$)")   { 
            return 404 '{"error":"not_found","reason":"missing"}'; 
        }

        rewrite ^/db/(.*) /$1 break;
        proxy_pass ${NGINX_COUCHDB_UPSTREAM};
        proxy_redirect off;

        # Request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never let a client inject CouchDB proxy-auth identity headers
        # (an empty value means the header is not passed upstream)
        proxy_set_header X-Auth-CouchDB-UserName "";
        proxy_set_header X-Auth-CouchDB-Roles "";
        proxy_set_header X-Auth-CouchDB-Token "";

        # Response headers
        proxy_hide_header Server;
        proxy_hide_header X-Couch-Request-ID;
        proxy_hide_header X-CouchDB-Body-Time;

        # [masking]: replaces (obfuscation) the body of these errors (status is kept),
        # including the 401/404 returned by the two checks above.
        # proxy_intercept_errors on;
        # error_page 400 401 403 404 405 409 412 415 416 417 /db_error.json;

        # Replication / long-poll
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;     # upstream is localhost
        client_body_buffer_size 512k;  # request bodies (_bulk_docs)
        proxy_buffering off;           # response streaming (_changes)
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # CouchDB has no WebSockets: plain HTTP/1.1 with upstream keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /db_error.json {
        internal;
        default_type application/json;
        return 200 '{"error": true, "message": "Operation failed", "code": $status}';
    }
}