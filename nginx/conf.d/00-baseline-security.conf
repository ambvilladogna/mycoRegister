# /etc/nginx/conf.d/00-baseline-security.conf

    tcp_nodelay on;
    keepalive_timeout 65;
    
    # Hide nginx version
    server_tokens off;
    
    # Dropping SSLv3, ref: POODLE
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # DoS protection
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
