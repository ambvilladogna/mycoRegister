# /etc/nginx/conf.d/10-custom-log-formats.conf

    # Define a custom log format (more verbose)
    log_format combined_plus '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" "$http_x_forwarded_for" '
                             '$request_time $upstream_response_time $pipe';
    
    # Define a simpler log format (for less critical paths)
    log_format simple '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent';
    
    # Global access log - can be enabled here if not specific per server block
    # access_log /var/log/nginx/access.log combined_plus;
    
    # Global error log - always enabled
    error_log /var/log/nginx/error.log warn; # Set level to info, warn, error, crit
